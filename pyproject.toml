[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "d-dolar"
version = "0.1.0"
description = "D-dolar and related double-dummy-based defence statistics for bridge"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Martin Nygren", email = "m@rtin.nygren.me.uk" }]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["polars>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
d-dolar-partnership-report = "d_dolar.reports.partnership_d_dolar:main"
d-dolar-second-defender-report = "d_dolar.reports.partnership_second_defender_tricks_lost:main"

[tool.hatch.build.targets.wheel]
packages = ["src/d_dolar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
packages = ["d_dolar"]
strict = true

# dds3 is a locally-built C extension (see specs/dds3-dependency.md) with
# no type stubs or py.typed marker of its own.
[[tool.mypy.overrides]]
module = "dds3"
ignore_missing_imports = true
